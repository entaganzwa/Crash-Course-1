<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Flood Archive (1985-Present)</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #map { height: 100vh; width: 100%; background: #262626; } /* Darker background for the dots to pop */
        
        /* Style for the Legend */
        .info.legend {
            background: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            line-height: 1.5;
            font-size: 12px;
            color: #333;
        }
        .legend i {
            width: 12px;
            height: 12px;
            float: left;
            margin-right: 8px;
            margin-top: 3px;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Initialize the map (Global view)
        const map = L.map('map').setView([15, 0], 2);

        // Dark-mode Map Tiles (CartoDB Dark Matter looks best for dots)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }).addTo(map);

        // Function to determine color by severity
        function getColor(severity) {
            return severity >= 2   ? '#ff0000' : // Severe (Red)
                   severity >= 1.5 ? '#ff7400' : // Moderate (Orange)
                                     '#ffc107';   // Minor (Yellow)
        }

        // Load the GeoJSON file
        fetch('flood_data.json')
            .then(response => response.json())
            .then(data => {
                L.geoJSON(data, {
                    // This tells Leaflet to draw dots (CircleMarkers) instead of polygons
                    pointToLayer: function (feature, latlng) {
                        const sev = feature.properties.SEVERITY || 1;
                        return L.circleMarker(latlng, {
                            radius: 6,
                            fillColor: getColor(sev),
                            color: "#fff",
                            weight: 1,
                            opacity: 1,
                            fillOpacity: 0.8
                        });
                    },
                    onEachFeature: function (feature, layer) {
                        const p = feature.properties;
                        const startDate = p.BEGAN ? p.BEGAN.split('T')[0] : 'Unknown';
                        
                        layer.bindPopup(`
                            <div style="font-size: 13px;">
                                <b style="font-size: 15px; color: ${getColor(p.SEVERITY)};">${p.COUNTRY || 'Flood'}</b><br>
                                <b>📅 Date:</b> ${startDate}<br>
                                <b>⚠️ Severity:</b> ${p.SEVERITY}<br>
                                <b>💀 Dead:</b> ${p.DEAD || 0}<br>
                                <b>📏 Area:</b> ${Math.round(p.AREA || 0).toLocaleString()} km²
                            </div>
                        `);
                    }
                }).addTo(map);
            });

        // Add the Legend to the bottom right
        const legend = L.control({position: 'bottomright'});
        legend.onAdd = function (map) {
            const div = L.DomUtil.create('div', 'info legend');
            const grades = [1, 1.5, 2];
            const labels = ['Minor', 'Moderate', 'Severe'];

            div.innerHTML = '<strong>Flood Severity</strong><br>';
            for (let i = 0; i < grades.length; i++) {
                div.innerHTML +=
                    '<i style="background:' + getColor(grades[i]) + '"></i> ' +
                    labels[i] + '<br>';
            }
            return div;
        };
        legend.addTo(map);

    </script>
</body>
</html>
