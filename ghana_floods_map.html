<!DOCTYPE html>
<html>
<head>
    <title>Ghana Flood Risk: Health Infrastructure Filter</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { height: 100vh; width: 100%; }
        .info { padding: 10px 12px; background: white; background: rgba(255,255,255,0.9); box-shadow: 0 0 15px rgba(0,0,0,0.2); border-radius: 8px; border: 1px solid #ccc; }
        .info h4 { margin: 0 0 5px; color: #333; }
        .legend { line-height: 18px; color: #555; }
        .legend i { width: 14px; height: 14px; float: left; margin-right: 8px; opacity: 0.8; border-radius: 50%; }
        .title-box { position: absolute; top: 10px; left: 50px; z-index: 1000; background: rgba(255,255,255,0.9); padding: 5px 15px; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.2); border: 1px solid #ccc; }
        .title-box h2 { margin: 5px 0; font-size: 1.2em; color: #b30000; }
    </style>
</head>
<body>

<div class="title-box">
    <h2>Ghana Health Infrastructure Risk Explorer</h2>
    <p style="margin: 0; font-size: 0.9em; color: #666;">Use the top-right menu to filter between "All Sites" and "At-Risk" sites.</p>
</div>
<div id="map"></div>

<script>
    // Center map on Ghana
    var map = L.map('map').setView([7.9465, -1.0232], 7);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // Create Layer Groups
    var floodLayer = L.layerGroup().addTo(map);
    var riskZoneLayer = L.layerGroup().addTo(map);
    var allHealthSitesLayer = L.layerGroup(); // Hidden by default
    var atRiskHealthSitesLayer = L.layerGroup().addTo(map); // Visible by default

    // --- 1. Load Flood Events ---
    Papa.parse("ghana_flood_events.csv", {
        download: true,
        header: true,
        complete: function(results) {
            results.data.forEach(function(row) {
                if (row.lat && row.long) {
                    L.circle([row.lat, row.long], {
                        color: '#737373',
                        fillColor: '#737373',
                        fillOpacity: 0.1,
                        radius: 5000 
                    }).addTo(riskZoneLayer);

                    L.circleMarker([row.lat, row.long], {
                        color: '#000',
                        weight: 1,
                        fillColor: '#333',
                        fillOpacity: 0.8,
                        radius: 4
                    }).addTo(floodLayer).bindPopup("<b>Flood Event (ID: " + row.ID + ")</b><br>Cause: " + row.MainCause);
                }
            });
        }
    });

    // --- 2. Load ALL Health Sites ---
    Papa.parse("ghana_health_sites.csv", {
        download: true,
        header: true,
        complete: function(results) {
            results.data.forEach(function(site) {
                if (site.Latitude && site.Longitude) {
                    L.circleMarker([site.Latitude, site.Longitude], {
                        color: '#0056b3',
                        weight: 1,
                        opacity: 0.5,
                        fillColor: '#3399ff',
                        fillOpacity: 0.4,
                        radius: 4
                    }).addTo(allHealthSitesLayer).bindPopup("<b>" + site.Name + "</b><br>Type: " + site.Type);
                }
            });
        }
    });

    // --- 3. Load AT-RISK Health Sites ---
    Papa.parse("at_risk_health_sites.csv", {
        download: true,
        header: true,
        complete: function(results) {
            results.data.forEach(function(site) {
                if (site.Latitude && site.Longitude) {
                    L.circleMarker([site.Latitude, site.Longitude], {
                        color: '#fff',
                        weight: 2,
                        opacity: 1,
                        fillColor: '#e31a1c',
                        fillOpacity: 1,
                        radius: 8
                    }).addTo(atRiskHealthSitesLayer).bindPopup("<b style='color:#e31a1c;'>AT-RISK FACILITY</b>" +
                                   "<br><b>Name:</b> " + site.Name +
                                   "<br><b>Distance to Flood:</b> " + site.Distance_km + " km");
                }
            });
        }
    });

    // --- Layer Control (The Filter) ---
    var overlayMaps = {
        "<span style='color: #e31a1c; font-weight: bold;'>At-Risk Health Sites</span>": atRiskHealthSitesLayer,
        "<span style='color: #0056b3;'>All Health Sites (Ghana)</span>": allHealthSitesLayer,
        "Flood Events": floodLayer,
        "5km Risk Zones": riskZoneLayer
    };

    L.control.layers(null, overlayMaps, {collapsed: false}).addTo(map);

</script>

</body>
</html>
